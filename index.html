<title>Attendance Tracker</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e5e8f0;--accent:#5b5cf0;--accent2:#7c3aed;--green:#16a34a;--red:#dc2626;--amber:#d97706;--shadow:0 12px 35px rgba(26,34,65,.07);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 5% 0%,rgba(91,92,240,.12),transparent 28%),radial-gradient(circle at 95% 5%,rgba(124,58,237,.10),transparent 25%),var(--bg);background-attachment:fixed;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
body.dark{--bg:#0c1020;--card:#151a2b;--text:#edf1ff;--muted:#9ca7bd;--line:#283047;--shadow:0 14px 40px rgba(0,0,0,.28);background:radial-gradient(circle at 5% 0%,rgba(91,92,240,.17),transparent 30%),radial-gradient(circle at 95% 5%,rgba(124,58,237,.13),transparent 25%),#0c1020}
button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 13px;border-radius:11px;font-weight:750;cursor:pointer;transition:.18s ease}button:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(25,32,60,.09)}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}button.danger{color:var(--red)}button.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center}
.container{max-width:1180px;margin:auto;padding:20px 20px 35px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:8px 0 20px}.brand h1{font-size:31px;letter-spacing:-1.2px;margin:0}.sub{color:var(--muted);margin-top:6px;font-size:14px}.identity{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.65);border:1px solid var(--line);font-size:11px;font-weight:800}.dark .chip{background:rgba(255,255,255,.04)}.erp{color:#4338ca;background:#eef2ff;border-color:#dfe3ff}.actions{display:flex;justify-content:flex-end;align-items:center;gap:7px;flex-wrap:wrap}.cloud{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#f1f3f8;border:1px solid var(--line);font-size:11px;font-weight:850;color:var(--muted)}.cloud.online{background:#eafaf0;color:#167342;border-color:#d3f2df}.cloud.sync{background:#eef2ff;color:#4338ca}.cloud.offline{background:#fff4e6;color:#9a5a00}.user{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.dark .card{background:rgba(21,26,43,.9)}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-42px;top:-52px;background:rgba(91,92,240,.07)}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:27px;font-weight:900;margin-top:6px;position:relative;z-index:1}.stat .mini{margin-top:5px;font-size:11px;color:var(--muted);position:relative;z-index:1}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}.tab{position:relative;overflow:hidden}.tab:after{content:"";position:absolute;inset:0 auto 0 -100%;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg)}.tab:hover:after{animation:sweep .7s ease}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:12px}.section-head h2{margin:0;font-size:21px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.actions-inline{display:flex;gap:7px;flex-wrap:wrap}.section{display:none}.section.active{display:block;animation:sectionIn .35s ease}
.alert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.alert{border-radius:14px;padding:13px;border:1px solid var(--line);background:var(--card)}.alert strong{display:block;font-size:13px}.alert span{font-size:12px;color:var(--muted);display:block;margin-top:4px}.alert.bad{background:#fff1f2;border-color:#ffdadd;color:#991b1b}.alert.warn{background:#fff8e8;border-color:#ffe8b5;color:#925a00}.alert.good{background:#ecfbf2;border-color:#d4f2df;color:#166534}.dark .alert.bad{background:#29151b}.dark .alert.warn{background:#292215}.dark .alert.good{background:#13261b}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;font-size:13px}th:last-child,td:last-child{border-right:0}th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--card)}.subject-name{font-weight:850}
.table-wrap{position:relative;overflow:auto;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);-webkit-overflow-scrolling:touch}
.table-wrap table{min-width:760px}
.table-wrap tr:last-child td{border-bottom:0}
.table-wrap thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
.table-wrap tbody tr:nth-child(even){background:rgba(120,130,170,.045)}
.dark .table-wrap tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
.table-wrap tbody tr:hover{background:rgba(91,92,240,.07)}
.table-wrap td:first-child,.table-wrap th:first-child{position:sticky;left:0;z-index:1;background:var(--card);border-right:2px solid var(--line)}
.table-wrap thead th:first-child{z-index:3}
.table-fade{position:absolute;top:0;right:0;bottom:0;width:34px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--card) 88%);opacity:0;transition:opacity .25s ease;border-radius:0 13px 13px 0}
.table-wrap.scrollable .table-fade{opacity:1}
.table-wrap.scrolled-end .table-fade{opacity:0}
.table-scroll-hint{display:none;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--muted);font-weight:800;margin-top:9px;opacity:.85}
.table-scroll-hint .arrow{display:inline-block;animation:hintNudge 1.4s ease-in-out infinite}
.table-wrap.scrollable~.table-scroll-hint{display:flex}
@keyframes hintNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){.table-scroll-hint .arrow{animation:none}}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:850}.good{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.dark .good{background:#15321f}.dark .warn{background:#352b12}.dark .bad{background:#35171d}.progress{height:7px;border-radius:99px;background:#edf0f5;overflow:hidden;margin-top:7px;min-width:80px}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left;animation:grow .7s ease}.ring{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;position:relative;background:conic-gradient(var(--ring,#5b5cf0) var(--deg,0deg),#e8ebf2 0);vertical-align:middle;margin-right:7px}.ring:after{content:"";position:absolute;inset:5px;background:var(--card);border-radius:50%}.ring b{position:relative;z-index:1;font-size:9px}
.planner{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:850}.field input,.field select{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);outline:none}.planner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.result-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card)}.result-card small{display:block;color:var(--muted);font-size:10px}.result-card strong{font-size:20px;display:block;margin-top:4px}
.chart-wrap{position:relative;height:280px}.chart-wrap canvas{width:100%;height:100%;display:block}.legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-label{text-align:center;color:var(--muted);font-size:10px;font-weight:850;padding:5px}.cal-day{min-height:64px;border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--card);cursor:pointer;transition:.18s}.cal-day:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(20,30,55,.07)}.cal-day.muted{opacity:.35}.cal-day.today{outline:2px solid rgba(91,92,240,.35)}.cal-day .num{font-size:11px;font-weight:850}.cal-day .marks{font-size:10px;margin-top:7px;color:var(--muted)}.cal-day .p{color:#16803d}.cal-day .a{color:#c62835}.history{max-height:420px;overflow:auto}.history-row{display:grid;grid-template-columns:105px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.history-row .date{color:var(--muted)}
.schedule{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.day h3{margin:0 0 9px;font-size:15px}.class{border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px;background:var(--card);transition:.2s}.class:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,30,55,.07)}.time{font-size:11px;color:var(--muted);font-weight:800}.subject{font-weight:800;margin:4px 0;font-size:13px}.type{font-size:10px;color:var(--muted)}.controls{display:flex;gap:7px;margin-top:8px;align-items:center}.status-actions{display:flex;gap:4px;background:#f1f3f8;border:1px solid var(--line);padding:4px;border-radius:12px}.dark .status-actions{background:#20263a}.status-btn{border:0;box-shadow:none;padding:7px 10px;border-radius:8px;font-size:11px;background:transparent;color:var(--muted);min-width:78px}.status-btn:hover{box-shadow:none;background:var(--card);transform:none}.status-btn.active.present{background:#e6f8ed;color:#167342}.status-btn.active.absent{background:#ffedf0;color:#b4232f}.status-btn.clear{min-width:34px}.attendance-status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;border:1px solid transparent;white-space:nowrap}.status-dot{width:7px;height:7px;border-radius:50%}.is-present{background:#ecfbf2;color:#167342;border-color:#d3f2df}.is-present .status-dot{background:#22c55e}.is-absent{background:#fff1f2;color:#b4232f;border-color:#ffe0e3}.is-none{background:#f4f5f8;color:#697287;border-color:#e8eaf0}.is-none .status-dot{background:#aab2c1}.mini-progress{height:4px;border-radius:99px;background:#edf0f5;overflow:hidden;margin-top:6px}.mini-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.modal{position:fixed;inset:0;z-index:2500;display:none;place-items:center;padding:18px;background:rgba(8,12,25,.62);backdrop-filter:blur(10px)}.modal.show{display:grid}.modal-box{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:modalIn .3s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0}.close{border:0;background:transparent;font-size:22px;padding:4px}.toast{position:fixed;right:18px;bottom:18px;z-index:3000;background:#182033;color:#fff;border-radius:13px;padding:12px 14px;display:flex;gap:9px;align-items:center;box-shadow:0 18px 45px rgba(0,0,0,.25);animation:toastIn .3s ease}.toast.hide{animation:toastOut .25s ease forwards}.scroll-top{position:fixed;right:18px;bottom:74px;z-index:1200;opacity:0;pointer-events:none;transform:translateY(10px)}.scroll-top.show{opacity:1;pointer-events:auto;transform:none}.auth-gate{position:fixed;inset:0;z-index:4000;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,rgba(91,92,240,.18),transparent 35%),radial-gradient(circle at 90% 80%,rgba(124,58,237,.16),transparent 35%),rgba(8,12,25,.78);backdrop-filter:blur(18px)}.auth-box{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.auth-box h2{margin:0 0 6px}.auth-box p{color:var(--muted);font-size:13px;line-height:1.5}.auth-box label{display:block;font-size:11px;font-weight:850;color:var(--muted);margin:13px 0 6px}.auth-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)}.auth-submit{width:100%;margin-top:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}.auth-error{min-height:18px;color:#b4232f;font-size:11px;margin-top:8px}.auth-brand{margin-bottom:20px}.auth-brand strong{font-size:16px}.auth-brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}.empty{text-align:center;color:var(--muted);padding:30px 15px}.offline-banner{display:none;padding:8px 12px;background:#fff4e6;color:#925a00;border:1px solid #ffe2ae;border-radius:10px;font-size:11px;font-weight:800;margin-bottom:12px}.offline-banner.show{display:block}.dark .offline-banner{background:#2a2214}
@keyframes sectionIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleX(0)}}@keyframes sweep{to{left:150%}}@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.schedule{grid-template-columns:repeat(2,1fr)}.planner{grid-template-columns:1fr}.alert-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){
  .container { padding: 12px 10px 28px; }
  .topbar { flex-direction: column; gap: 10px; padding-bottom: 14px; }
  .brand h1 { font-size: 25px; line-height: 1.15; }
  .sub { font-size: 12px; line-height: 1.4; }
  .identity { gap: 6px; margin-top: 8px; }
  .chip { font-size: 10px; padding: 6px 9px; }

  /* Fix: Actions section for mobile */
  .actions {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }
  .cloud { flex: 1; min-width: 0; text-align: center; }
  .user { flex: 1; min-width: 0; text-align: center; }
  #signoutBtn { flex: 1; min-width: 0; }
  #themeBtn { flex: 0 0 42px; height: 42px; min-width: 42px; padding: 0; }

  /* Fix: Stat cards for mobile */
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat {
    min-width: 0;
    padding: 13px;
  }
  .stat .label { font-size: 10px; }
  .stat .value { font-size: 21px; }
  .stat .mini { font-size: 9px; line-height: 1.3; }

  .tabs { gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; white-space: nowrap; font-size: 10px; padding: 9px 11px; }

  .section { padding: 13px; }
  .section-head { align-items: flex-start; gap: 10px; }
  .section-head h2 { font-size: 18px; }
  .section-head p { font-size: 11px; line-height: 1.45; }

  #summary .section-head { flex-direction: column; }
  #summary .section-head button { width: 100%; }

  #daily .section-head { flex-direction: column; }
  #daily .section-head .actions-inline { width: 100%; }
  #daily .actions-inline { justify-content: space-between; }
  #datePicker { flex: 1; min-width: 0; }
  .reset-btn { padding: 9px 11px; }

  #dayList .class { padding: 13px; }
  #dayList .subject { font-size: 13px; line-height: 1.35; }
  .controls { flex-wrap: wrap; gap: 7px; }
  .status-actions { width: 100%; }
  .status-btn { flex: 1; min-width: 0; padding: 9px 5px; font-size: 11px; }
  .attendance-status { margin-left: 0; flex: 1; justify-content: center; }

  .summary-calendar-card { padding: 12px; }
  .cal-day { min-height: 50px; }
  table { min-width: 700px; }
  .planner-grid { grid-template-columns: 1fr; }

  .toast { left: 10px; right: 10px; bottom: 12px; max-width: none; }
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.summary-calendar-card{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--card),rgba(248,249,255,.78));box-shadow:0 8px 24px rgba(20,30,55,.045)}
.summary-calendar-card .calendar{gap:5px}
.summary-calendar-card .cal-day{min-height:58px}
.calendar-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:10px;color:var(--muted);font-weight:700}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.present-dot{background:#16a34a}.absent-dot{background:#d62839}

/* ===== Premium scroll motion ===== */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
.scroll-progress{position:fixed;top:0;left:0;width:0;height:3px;z-index:3000;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px rgba(91,92,240,.45);transition:width .08s linear}
.reveal-on-scroll{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .7s cubic-bezier(.2,.75,.2,1),transform .7s cubic-bezier(.2,.75,.2,1)}
.reveal-on-scroll.revealed{opacity:1;transform:none}
.reveal-left{opacity:0;transform:translateX(-28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.75,.2,1)}
.reveal-left.revealed{opacity:1;transform:none}
.reveal-right{opacity:0;transform:translateX(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.75,.2,1)}
.reveal-right.revealed{opacity:1;transform:none}
.stagger-item{opacity:0;transform:translateY(18px);animation:staggerIn .65s cubic-bezier(.2,.8,.2,1) forwards}
.glow-orb{position:fixed;width:220px;height:220px;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,rgba(124,58,237,.12),transparent 68%);filter:blur(10px);transform:translate(-50%,-50%);transition:left .18s ease,top .18s ease}
.card,.summary-calendar-card,.planner-card,.history-card,.timetable-card{will-change:transform}
.card:hover,.summary-calendar-card:hover,.planner-card:hover,.history-card:hover,.timetable-card:hover{transform:translateY(-3px);transition:transform .28s ease,box-shadow .28s ease}
.hero-float{animation:heroFloat 5s ease-in-out infinite}
.pulse-soft{animation:pulseSoft 2.8s ease-in-out infinite}
@keyframes staggerIn{to{opacity:1;transform:none}}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulseSoft{0%,100%{box-shadow:0 0 0 0 rgba(91,92,240,0)}50%{box-shadow:0 0 0 8px rgba(91,92,240,.05)}}
@media(prefers-reduced-motion:reduce){
 .reveal-on-scroll,.reveal-left,.reveal-right{opacity:1;transform:none;transition:none}
 .stagger-item,.hero-float,.pulse-soft{animation:none;opacity:1;transform:none}
 html{scroll-behavior:auto}
}

.status-btn:disabled,.status-btn.locked{
  opacity:.48;
  cursor:not-allowed;
  transform:none!important;
  filter:saturate(.65);
}
.status-btn:disabled:hover{transform:none!important;box-shadow:none!important}
.attendance-locked .attendance-status{font-weight:800}
.attendance-locked{animation:lockFlash .55s ease-out}
@keyframes lockFlash{
  0%{box-shadow:0 0 0 0 rgba(91,92,240,.18)}
  100%{box-shadow:0 0 0 10px rgba(91,92,240,0)}
}

.reset-btn{
 border:1px solid rgba(220,70,80,.22);
 background:var(--card);
 color:#c83f4a;
 padding:10px 15px;
 border-radius:12px;
 font-weight:800;
 cursor:pointer;
 transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
}
.reset-btn:hover{
 transform:translateY(-2px);
 box-shadow:0 10px 24px rgba(200,63,74,.14);
 background:#fff7f7;
}

/* ===== Premium refinement pass ===== */
:root{--shadow-sm:0 2px 8px rgba(20,30,60,.05);--shadow-md:0 10px 30px rgba(20,30,60,.075);--shadow-lg:0 24px 60px rgba(20,30,60,.13)}
body{font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
.brand h1,.section-head h2,.modal-head h3,.auth-box h2{font-family:'Lexend',Inter,system-ui,sans-serif}
.brand h1{font-weight:800;letter-spacing:-1.4px;background:linear-gradient(135deg,var(--text) 35%,var(--accent) 130%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card{box-shadow:var(--shadow-md);border-color:rgba(120,130,170,.14)}
.dark .card{border-color:rgba(255,255,255,.06)}
.card:hover,.summary-calendar-card:hover,.planner-card:hover,.history-card:hover,.timetable-card:hover{box-shadow:var(--shadow-lg)}
button{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,background .18s ease,border-color .18s ease}
button.primary{box-shadow:0 10px 24px rgba(91,92,240,.3)}
button.primary:hover{box-shadow:0 14px 32px rgba(91,92,240,.4)}
button:active{transform:translateY(0) scale(.97)}
.stat{border-color:rgba(120,130,170,.14)}
.stat .value{font-family:'Lexend',Inter,system-ui,sans-serif;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.tab{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,background .25s ease,color .25s ease}
.status-btn{transition:background .16s ease,color .16s ease}
.toast{border-radius:15px;padding:11px 12px 11px 13px;gap:10px;align-items:center}
.toast b{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:rgba(255,255,255,.15);font-size:12px;flex-shrink:0}
.toast-action{margin-left:2px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;padding:6px 11px;border-radius:9px;font-size:11px;font-weight:800;white-space:nowrap}
.toast-action:hover{background:rgba(255,255,255,.28);transform:none;box-shadow:none}
.undo-row-btn{width:33px;height:33px;border-radius:10px;color:var(--accent);border-color:rgba(91,92,240,.22);background:rgba(91,92,240,.07);flex-shrink:0}
.undo-row-btn:hover{background:rgba(91,92,240,.14)}
.undo-last-btn{color:var(--accent);border-color:rgba(91,92,240,.22)}
.undo-last-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
::selection{background:rgba(91,92,240,.22)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,130,170,.28);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,130,170,.44);background-clip:padding-box}
.auth-box{animation:modalIn .35s cubic-bezier(.2,.8,.2,1)}

.user{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;background:var(--card);color:var(--text);border-color:var(--line);font-size:11px;font-weight:800}
.mail-icon{width:19px;height:19px;display:inline-grid;place-items:center;border-radius:6px;background:rgba(91,92,240,.10);color:var(--accent);font-size:11px;flex:0 0 auto}
#userEmail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.theme-toggle{min-width:92px;height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;background:linear-gradient(135deg,rgba(91,92,240,.10),rgba(124,58,237,.08));border-color:rgba(91,92,240,.20);color:var(--text);font-size:11px;font-weight:850}
.theme-toggle .theme-icon{font-size:16px;line-height:1}
.theme-toggle:hover{background:linear-gradient(135deg,rgba(91,92,240,.16),rgba(124,58,237,.13));box-shadow:0 8px 20px rgba(91,92,240,.12)}

/* ===== Mobile UI refinement ===== */
@media (max-width: 620px) {
  .container { padding: 12px 10px 28px; }
  .topbar { flex-direction: column; gap: 10px; padding-bottom: 14px; }
  .brand h1 { font-size: 25px; line-height: 1.15; }
  .sub { font-size: 12px; line-height: 1.4; }
  .identity { gap: 6px; margin-top: 8px; }
  .chip { font-size: 10px; padding: 6px 9px; }

  /* Fix: Actions section for mobile */
  .actions {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }
  .cloud { flex: 1; min-width: 0; text-align: center; }
  .user { flex: 1; min-width: 0; text-align: center; }
  #signoutBtn { flex: 1; min-width: 0; }
  #themeBtn { flex: 0 0 42px; height: 42px; min-width: 42px; padding: 0; }

  /* Fix: Stat cards for mobile */
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat {
    min-width: 0;
    padding: 13px;
  }
  .stat .label { font-size: 10px; }
  .stat .value { font-size: 21px; }
  .stat .mini { font-size: 9px; line-height: 1.3; }

  .tabs { gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; white-space: nowrap; font-size: 10px; padding: 9px 11px; }

  .section { padding: 13px; }
  .section-head { align-items: flex-start; gap: 10px; }
  .section-head h2 { font-size: 18px; }
  .section-head p { font-size: 11px; line-height: 1.45; }

  #summary .section-head { flex-direction: column; }
  #summary .section-head button { width: 100%; }

  #daily .section-head { flex-direction: column; }
  #daily .section-head .actions-inline { width: 100%; }
  #daily .actions-inline { justify-content: space-between; }
  #datePicker { flex: 1; min-width: 0; }
  .reset-btn { padding: 9px 11px; }

  #dayList .class { padding: 13px; }
  #dayList .subject { font-size: 13px; line-height: 1.35; }
  .controls { flex-wrap: wrap; gap: 7px; }
  .status-actions { width: 100%; }
  .status-btn { flex: 1; min-width: 0; padding: 9px 5px; font-size: 11px; }
  .attendance-status { margin-left: 0; flex: 1; justify-content: center; }

  .summary-calendar-card { padding: 12px; }
  .cal-day { min-height: 50px; }
  table { min-width: 700px; }
  .planner-grid { grid-template-columns: 1fr; }

  .toast { left: 10px; right: 10px; bottom: 12px; max-width: none; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
